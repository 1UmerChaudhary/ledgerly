name: ledgerly_data
description: Ledgerly's local database layer — drift schema, migrations, repositories, backups. Pure Dart so it runs under `dart test` and can be reused outside the Flutter app.
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.0
dependencies:
  drift: ^2.35.0
  sqlite3: ^3.6.0
  ledgerly_core:
    path: ../ledgerly_core
  meta: ^1.15.0
  path: ^1.9.0
  uuid: ^4.6.0
  pdf: ^3.13.0
  intl: ^0.20.3
  cryptography: ^2.9.0
dev_dependencies:
  test: ^1.25.0
  lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.4.0
# INERT, kept only to document that this package depends on it. Pub reads hook
# user-defines from the workspace ROOT pubspec (../../pubspec.yaml) and ignores
# member ones, so editing this block changes nothing. Edit the root instead.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
