name: Backend CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      # Docker is preinstalled on ubuntu-latest runners; testcontainers uses
      # it to spin up a real Postgres for every test module that needs one.
      - name: Test
        run: python -m pytest -v
