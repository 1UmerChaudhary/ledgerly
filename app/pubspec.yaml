name: ledgerly
description: "A new Flutter project."
publish_to: none
resolution: workspace
version: 0.2.0+2

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.0
  flutter:
    sdk: flutter
  ledgerly_core:
    path: ../packages/ledgerly_core
  ledgerly_data:
    path: ../packages/ledgerly_data
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  # @visibleForTesting on EncryptionService's crash-simulation seam.
  meta: ^1.15.0
  path: ^1.9.1
  sqlite3: ^3.6.0
  uuid: ^4.6.0
  path_provider: ^2.1.6
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  printing: ^5.15.0
  print_bluetooth_thermal: ^1.2.4
  file_selector: ^1.1.0
  http: ^1.2.0
  flutter_file_downloader: ^2.1.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # test/bootstrap/encrypted_database_test.dart is a plain Dart test (real file
  # I/O, no widget tester), so it imports package:test directly.
  test: ^1.25.0
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# sqlite3 3.x bundles the native library through Dart hooks. Ship the SQLCipher
# build from day one (key empty until encryption is turned on) because swapping
# the library after customers have databases is not possible.
#
# INERT, kept only to document that this package depends on it. Pub reads hook
# user-defines from the workspace ROOT pubspec (../pubspec.yaml) and ignores
# member ones, so editing this block changes nothing. Edit the root instead.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
