name: ledgerly
description: "A new Flutter project."
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.0
  flutter:
    sdk: flutter
  ledgerly_core:
    path: ../packages/ledgerly_core
  ledgerly_data:
    path: ../packages/ledgerly_data
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  path: ^1.9.1
  sqlite3: ^3.6.0
  uuid: ^4.6.0
  path_provider: ^2.1.6
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter
  printing: ^5.15.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# sqlite3 3.x bundles the native library through Dart hooks. Ship the SQLCipher
# build from day one (key empty until encryption is turned on) because swapping
# the library after customers have databases is not possible.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
