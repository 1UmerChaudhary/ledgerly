name: ledgerly
description: "A new Flutter project."
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.0
  flutter:
    sdk: flutter
  ledgerly_core:
    path: ../packages/ledgerly_core
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.6.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

# sqlite3 3.x bundles the native library through Dart hooks. Ship the SQLCipher
# build from day one (key empty until encryption is turned on) because swapping
# the library after customers have databases is not possible.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
